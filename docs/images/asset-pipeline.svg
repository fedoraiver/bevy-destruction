<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="509" viewBox="0 0 1200 509" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
  <title id="title">Blender 预破碎到 Bevy 导入</title>
  <desc id="desc">建筑输入经共享分区生成源显示网格和 v2 结构数据。依据临时 GLB 检查接触两端，通过后先发布哈希命名的 GLB，再原子替换清单，供 Bevy 校验并导入。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#657991" />
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="507" rx="24" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="43" y="59" fill="#172435" font-size="34" font-weight="700" text-anchor="start">Blender 预破碎到 Bevy 导入</text>
  <text x="43" y="94" fill="#4d6074" font-size="21" font-weight="400" text-anchor="start">显示网格与结构清单由同一份几何生成</text>
  <path d="M 238 230 H 278" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 504 230 H 528 V 166 H 552" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 504 230 H 528 V 300 H 552" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 833 166 H 862 V 230 H 890" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <path d="M 833 300 H 862 V 230 H 890" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <rect x="42" y="179" width="194" height="103" rx="15" fill="#e7f5f1" stroke="#cbd5e1" />
  <text x="60" y="213" fill="#096b65" font-size="24" font-weight="700" text-anchor="start">建筑输入</text>
  <text x="60" y="243" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">封闭轮廓与门窗</text>
  <text x="60" y="267" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">或显式凸构件</text>
  <rect x="280" y="179" width="222" height="103" rx="15" fill="#e7f5f1" stroke="#cbd5e1" />
  <text x="298" y="213" fill="#096b65" font-size="24" font-weight="700" text-anchor="start">共享不规则分区</text>
  <text x="298" y="243" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">按源域生成逻辑块</text>
  <text x="298" y="267" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">保留洞口与真实边界</text>
  <rect x="554" y="115" width="277" height="102" rx="15" fill="#ebf2fe" stroke="#cbd5e1" />
  <text x="572" y="149" fill="#2457a6" font-size="24" font-weight="700" text-anchor="start">临时 GLB</text>
  <text x="572" y="179" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">源碎块网格、材质角色</text>
  <text x="572" y="203" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">按 Chunk ID 对应显示节点</text>
  <rect x="554" y="249" width="277" height="102" rx="15" fill="#ebf2fe" stroke="#cbd5e1" />
  <text x="572" y="283" fill="#2457a6" font-size="24" font-weight="700" text-anchor="start">v2 结构数据</text>
  <text x="572" y="313" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">复合凸代理、质量、锚点</text>
  <text x="572" y="337" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">Bond 规范接触面片</text>
  <rect x="892" y="179" width="265" height="103" rx="15" fill="#fff3e5" stroke="#cbd5e1" />
  <text x="910" y="213" fill="#9a5416" font-size="24" font-weight="700" text-anchor="start">双端接触复核</text>
  <text x="910" y="243" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">以实际 GLB 检查覆盖</text>
  <text x="910" y="267" fill="#4d6074" font-size="20" font-weight="400" text-anchor="start">允许预算内的面片微修正</text>
  <path d="M 1024 282 V 365" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="42" y="365" width="1115" height="116" rx="15" fill="#ffffff" stroke="#cbd5e1" />
  <text x="62" y="396" fill="#4d6074" font-size="19" font-weight="700" text-anchor="start">复核通过后</text>
  <text x="62" y="445" fill="#172435" font-size="24" font-weight="700" text-anchor="start">先发布哈希命名的 GLB</text>
  <path d="M 365 437 H 425" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="455" y="445" fill="#172435" font-size="24" font-weight="700" text-anchor="start">原子替换 v2 清单</text>
  <path d="M 716 437 H 776" fill="none" stroke="#657991" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="809" y="445" fill="#172435" font-size="24" font-weight="700" text-anchor="start">Bevy 校验清单与哈希后导入</text>
</svg>
