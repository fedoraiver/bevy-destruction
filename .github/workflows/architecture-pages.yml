name: Architecture Pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: fedoraiver/bevy-cicd/.github/workflows/architecture-build.yml@6aad82eb888c62872c99b992e619952d527b3b4b

  publish:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: fedoraiver/bevy-cicd/.github/workflows/architecture-pages.yml@6aad82eb888c62872c99b992e619952d527b3b4b
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}
