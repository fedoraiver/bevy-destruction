[package]
name = "bevy-destruction"
version = "0.1.0"
edition = "2024"

[package.metadata.bevy-architecture]
app-factory = "build_app"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d_bevy_render", "default_app", "bevy_winit", "bevy_ui_render", "default_font", "multi_threaded", "png", "scene", "x11"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.dev]
debug = 1

[profile.dev.package.bevy-destruction]
opt-level = 2

[profile.dev.package.avian3d]
opt-level = 2

[profile.dev.package.parry3d]
opt-level = 2
