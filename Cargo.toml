[workspace]
members = ["apps/game", "apps/acceptance", "tools/ecs-architecture"]
default-members = ["apps/game"]
resolver = "3"

[workspace.metadata.bevy-architecture]
package = "ecs-architecture"

[workspace.dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["3d_bevy_render", "default_app", "bevy_winit", "bevy_ui_render", "default_font", "multi_threaded", "png", "scene", "x11"] }
avian3d = { version = "=0.8.0", default-features = false, features = ["3d", "parry-f32", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ecs_architecture)'] }

[profile.dev]
debug = 1

[profile.dev.package.bevy-destruction]
opt-level = 2

[profile.dev.package.ecs-architecture]
opt-level = 2

[profile.dev.package.avian3d]
opt-level = 2

[profile.dev.package.parry3d]
opt-level = 2
